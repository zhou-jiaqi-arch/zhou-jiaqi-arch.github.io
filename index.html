<script>
const zh={name:'周佳琦',lead:'具身智能算法研究者，专注于 VLA、机器人策略后训练与异构具身数据统一建模。',email:'邮箱',nav:['关于我','研究项目','实习经历','研究成果'],aboutTitle:'关于我',about:['我的研究兴趣集中在 Vision-Language-Action（VLA）模型、价值引导的离线强化学习，以及面向真实机器人的数据与策略闭环。','目前围绕多物体语言条件抓取、穿扎带等具身操作任务开展研究与工程实践，关注模型泛化、轨迹质量和真机可靠性。'],researchTitle:'研究项目',experienceTitle:'实习经历',outputsTitle:'研究成果',output:'论文产出',video:'视频',videoNote:'视频文件待补充',projects:[{title:'Value-Guided Offline RL Post-Training for Dressing Tasks',sub:'穿扎带任务价值引导离线 RL 后训练',kind:'项目',time:'2026.06 - 2026.07',out:'',desc:'针对长时序穿戴任务中容易出现的中途失稳与动作累积误差，基于 ARX 机械臂搭建穿扎带真机数据采集流程，通过遥操作示教、真机 rollout 与人类干预回收成功、失败及干预轨迹。构建价值引导的离线强化学习后训练流程，使用 value model 评估轨迹状态并根据未来收益划分优势标签，将优势信息作为条件输入 VLA 策略，将任务成功率从 35% 提升至 95%。',videos:[['穿扎带演示','videos/2026_06_zhadai/2026_07_zhadai.mp4']]},{title:'UCAG-P',sub:'面向异构具身操作数据的相机中心 VLA 统一建模',kind:'科研',time:'2026.05 - 2026.08',out:'AAAI 在投 / 第一作者',desc:'面向机器人形态、相机配置与低层动作空间不一致导致的 VLA 数据难以统一训练问题，提出相机中心具身操作建模框架 UCAG-P，将单臂、双臂、人形机器人、灵巧手与人类演示数据对齐到共享视觉几何动作空间。构建基于腕部/末端执行器与抓取中心的双锚点动作表示，并实现几何条件化动作转换模块，将共享几何动作映射为目标机器人可执行控制指令。该方法基于 11 个数据集、超过 6,000 小时、覆盖 9 类机器人/人类本体的异构具身数据进行训练，在 LIBERO、LIBERO-Plus、RoboTwin Easy/Hard 与 RoboCasa GR1 上分别取得 98.25%、82.0%、88.45% / 89.12% 与 62.0% 成功率。',videos:[['UCAG-P 方法视频','videos/ucag-p.mp4']]}],experience:[{company:'小米',role:'具身智能算法实习生',time:'2026.05 - 2026.08',desc:'围绕具身操作中的 VLA 训练、策略后训练与异构数据统一建模开展算法研发。多物体语言条件抓取任务中，完成数据清洗、目标框标注、语言指令增强、VLA 训练与泛化评估，支持模型根据自然语言在多物体场景中定位并抓取指定目标。穿扎带任务中，基于遥操作示教初始化 VLA 策略，通过真机 rollout 与人类干预回收成功、失败及干预轨迹，并引入价值评估与优势条件化标注进行离线 RL 后训练。UCAG-P 工作中，参与相机中心异构具身数据统一建模，将不同机器人本体与人类演示数据对齐到共享视觉几何动作空间。'}],outputs:[{title:'Value-Guided Offline RL Post-Training for Dressing Tasks',line:'第一作者 · 研究中'},{title:'UCAG-P：面向异构具身操作数据的相机中心 VLA 统一建模',line:'第一作者 · AAAI 在投'}],foot:'© 2026 周佳琦 · Embodied AI'};
const en={name:'Jiaqi Zhou',lead:'Embodied AI researcher working on VLA, robot policy post-training, and unified modeling of heterogeneous embodied data.',email:'Email',nav:['About','Research','Experience','Outputs'],aboutTitle:'About',about:['My research focuses on Vision-Language-Action models, value-guided offline reinforcement learning, and closed-loop data and policy development for real robots.','I work on language-conditioned grasping, dressing tasks, policy generalization, trajectory quality, and reliable real-world execution.'],researchTitle:'Research',experienceTitle:'Experience',outputsTitle:'Research Outputs',output:'Publication',video:'Video',videoNote:'Place your files in the videos/ directory to enable playback',projects:[{title:'Value-Guided Offline RL Post-Training for Dressing Task',sub:'Value-guided offline RL for a dressing task',kind:'Project',time:'2026.05 - 2026.08',out:'',desc:'Initialized a VLA policy from teleoperation demonstrations, collected successful, failed, and intervention trajectories through real-robot rollouts, and introduced value evaluation with advantage-conditioned labels for offline RL post-training.',videos:[['Dressing task demo','videos/dressing-task.mp4']]},{title:'UCAG-P',sub:'Camera-centric unified VLA modeling for heterogeneous embodied manipulation data',kind:'Research',time:'2026.05 - 2026.08',out:'AAAI under review / First author',desc:'Aligned heterogeneous robot and human demonstration data into a shared visual-geometric action space, exploring camera-centric unified modeling for VLA training.',videos:[['UCAG-P demo','videos/ucag-p.mp4']]}],experience:[{company:'Xiaomi',role:'Embodied AI Algorithm Intern',time:'2026.05 - 2026.08',desc:'Developed algorithms for VLA training, policy post-training, and unified modeling of heterogeneous embodied data. Built data cleaning, bounding-box annotation, instruction augmentation, VLA training, and generalization evaluation pipelines for language-conditioned multi-object grasping. For a dressing task, initialized a VLA policy from teleoperation, collected rollout and intervention trajectories on a real robot, and applied value evaluation with advantage-conditioned labels for offline RL post-training. Contributed to UCAG-P by aligning robot and human demonstrations in a shared visual-geometric action space.'}],outputs:[{title:'Value-Guided Offline RL Post-Training for Dressing Task',line:'First author · In progress'},{title:'UCAG-P: Camera-centric unified VLA modeling for heterogeneous embodied manipulation data',line:'First author · AAAI under review'}],foot:'© 2026 Jiaqi Zhou · Embodied AI'};
let lang='zh';
function render(){const d=lang==='zh'?zh:en;document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=d.name+' · Embodied AI';[['name',d.name],['lead',d.lead],['email-label',d.email],['about-title',d.aboutTitle],['research-title',d.researchTitle],['experience-title',d.experienceTitle],['outputs-title',d.outputsTitle],['foot',d.foot]].forEach(([id,v])=>document.getElementById(id).textContent=v);['nav-about','nav-research','nav-experience','nav-outputs'].forEach((id,i)=>document.getElementById(id).textContent=d.nav[i]);d.about.forEach((v,i)=>document.getElementById('about-'+(i+1)).textContent=v);document.getElementById('research-list').innerHTML=d.projects.map(p=>`<article class="entry"><div class="head"><div><h3 class="title">${p.title}</h3><div class="subtitle">${p.sub}</div></div><div class="time">${p.time}</div></div><div class="badges"><span class="badge">${p.kind}</span>${p.out?`<span class="badge">${d.output}: ${p.out}</span>`:''}</div><p class="desc">${p.desc}</p><div class="video-groups"><div class="video-label">${d.video}</div><div class="video-strip">${p.videos.map(v=>`<div class="video-card"><video controls preload="metadata"><source src="${v[1]}" type="video/mp4"></video><div class="video-info"><div class="video-title">${v[0]}</div><span class="video-note">${d.videoNote}</span></div></div>`).join('')}</div></div></article>`).join('');document.getElementById('experience-list').innerHTML=d.experience.map(x=>`<article class="entry"><div class="head"><div><h3 class="title">${x.company}</h3><div class="subtitle">${x.role}</div></div><div class="time">${x.time}</div></div><p class="desc">${x.desc}</p></article>`).join('');document.getElementById('outputs-list').innerHTML=d.outputs.map(x=>`<article class="entry"><h3 class="title">${x.title}</h3><p class="publine">${x.line}</p></article>`).join('');document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang))}document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;render()}));render();
</script></body></html>
