<script>
const zh={name:'周佳琦',enName:'Jiaqi Zhou',lead:'具身智能算法研究者，专注于 VLA、机器人策略后训练与异构具身数据统一建模。',focus:'研究方向',nav:['关于我','研究项目','实习经历','研究成果'],aboutTitle:'让机器人从多源经验中学习可靠的操作策略',about:['我的研究兴趣集中在 Vision-Language-Action（VLA）模型、价值引导的离线强化学习，以及面向真实机器人的数据与策略闭环。','目前围绕多物体语言条件抓取、穿扎带等具身操作任务开展研究与工程实践，关注模型泛化、轨迹质量和真机可靠性。'],stats:[['95%','穿扎带任务成功率'],['6,000+ h','异构具身训练数据'],['11','统一训练数据集'],['AAAI','第一作者 · 在投']],researchTitle:'代表性研究',experienceTitle:'实习经历',outputsTitle:'论文与研究成果',output:'论文产出',video:'实验演示',videoNote:'视频即将更新',projects:[{title:'Value-Guided Offline RL Post-Training for Dressing Tasks',sub:'穿扎带任务价值引导离线 RL 后训练',kind:'项目',time:'2026.06 - 2026.07',out:'',desc:'针对长时序穿戴任务中容易出现的中途失稳与动作累积误差，基于 ARX 机械臂搭建穿扎带真机数据采集流程，通过遥操作示教、真机 rollout 与人类干预回收成功、失败及干预轨迹。构建价值引导的离线强化学习后训练流程，使用 value model 评估轨迹状态并根据未来收益划分优势标签，将优势信息作为条件输入 VLA 策略，将任务成功率从 35% 提升至 95%。',pipeline:[['DATA','遥操作与真机 Rollout'],['FEEDBACK','成功 / 失败 / 干预轨迹'],['VALUE','未来收益与优势标注'],['POLICY','VLA 离线 RL 后训练']],media:{type:'video',src:'2026_07_zhadai.mp4',title:'穿扎带真机演示'}},{title:'UCAG-P',sub:'面向异构具身操作数据的相机中心 VLA 统一建模',kind:'科研',time:'2026.05 - 2026.08',out:'AAAI 在投 / 第一作者',desc:'面向机器人形态、相机配置与低层动作空间不一致导致的 VLA 数据难以统一训练问题，提出相机中心具身操作建模框架 UCAG-P，将单臂、双臂、人形机器人、灵巧手与人类演示数据对齐到共享视觉几何动作空间。构建基于腕部/末端执行器与抓取中心的双锚点动作表示，并实现几何条件化动作转换模块，将共享几何动作映射为目标机器人可执行控制指令。该方法基于 11 个数据集、超过 6,000 小时、覆盖 9 类机器人/人类本体的异构具身数据进行训练，在 LIBERO、LIBERO-Plus、RoboTwin Easy/Hard 与 RoboCasa GR1 上分别取得 98.25%、82.0%、88.45% / 89.12% 与 62.0% 成功率。',pipeline:[['INPUT','9 类机器人 / 人类本体'],['GEOMETRY','相机中心双锚点表示'],['ALIGNMENT','共享视觉几何动作空间'],['CONTROL','可执行机器人指令']],media:{type:'image',src:'ucagp_overview.png',title:'UCAG-P 方法总览'}}],experience:[{company:'小米',role:'具身智能算法实习生',time:'2026.05 - 2026.08',desc:'围绕具身操作中的 VLA 训练、策略后训练与异构数据统一建模开展算法研发。多物体语言条件抓取任务中，完成数据清洗、目标框标注、语言指令增强、VLA 训练与泛化评估，支持模型根据自然语言在多物体场景中定位并抓取指定目标。穿扎带任务中，基于遥操作示教初始化 VLA 策略，通过真机 rollout 与人类干预回收成功、失败及干预轨迹，并引入价值评估与优势条件化标注进行离线 RL 后训练。UCAG-P 工作中，参与相机中心异构具身数据统一建模，将不同机器人本体与人类演示数据对齐到共享视觉几何动作空间。'}],outputs:[{title:'Value-Guided Offline RL Post-Training for Dressing Tasks',line:'第一作者 · 研究中',status:'IN PROGRESS'},{title:'UCAG-P: Unified Camera-Centric Action Geometry for Heterogeneous Embodied Manipulation',line:'第一作者 · AAAI 在投',status:'UNDER REVIEW'}],foot:'© 2026 周佳琦 · Embodied AI'};
const en={...zh,name:'Jiaqi Zhou',enName:'周佳琦',lead:'Embodied AI researcher working on VLA, robot policy post-training, and unified modeling of heterogeneous embodied data.',focus:'Research Focus',nav:['About','Research','Experience','Outputs'],aboutTitle:'Learning reliable robot policies from diverse embodied experience',about:['My research focuses on Vision-Language-Action models, value-guided offline reinforcement learning, and closed-loop data and policy development for real robots.','I work on language-conditioned grasping and dressing tasks, with an emphasis on policy generalization, trajectory quality, and reliable real-world execution.'],stats:[['95%','Dressing task success'],['6,000+ h','Embodied training data'],['11','Unified datasets'],['AAAI','First author · Under review']],researchTitle:'Selected Research',experienceTitle:'Experience',outputsTitle:'Publications & Research',output:'Output',video:'Demo',videoNote:'Video coming soon',projects:[{title:'Value-Guided Offline RL Post-Training for Dressing Tasks',sub:'Value-guided offline RL for a dressing task',kind:'Project',time:'2026.06 - 2026.07',out:'',desc:'Built a real-robot data loop on an ARX arm for long-horizon dressing tasks, collecting successful, failed, and intervention trajectories through teleoperation and rollouts. A value model estimates trajectory states and derives advantage labels from future returns; conditioning the VLA policy on this advantage signal improved task success from 35% to 95%.',pipeline:[['DATA','Teleoperation & rollouts'],['FEEDBACK','Success / failure / intervention'],['VALUE','Return-based advantage labels'],['POLICY','Offline RL post-training']],media:{type:'video',src:'2026_07_zhadai.mp4',title:'Real-robot dressing demo'}},{title:'UCAG-P',sub:'Camera-centric unified VLA modeling for heterogeneous embodied manipulation data',kind:'Research',time:'2026.05 - 2026.08',out:'AAAI under review / First author',desc:'Proposed a camera-centric framework that aligns single-arm, bimanual, humanoid, dexterous-hand, and human demonstrations in a shared visual-geometric action space. A dual-anchor action representation and geometry-conditioned conversion module map shared actions to executable commands. Training covers 11 datasets, 6,000+ hours, and 9 embodiments, with 98.25% on LIBERO, 82.0% on LIBERO-Plus, 88.45% / 89.12% on RoboTwin Easy/Hard, and 62.0% on RoboCasa GR1.',pipeline:[['INPUT','9 robot / human embodiments'],['GEOMETRY','Camera-centric dual anchors'],['ALIGNMENT','Shared geometric action space'],['CONTROL','Executable robot commands']],media:{type:'image',src:'ucagp_overview.png',title:'UCAG-P method overview'}}],experience:[{company:'Xiaomi',role:'Embodied AI Algorithm Intern',time:'2026.05 - 2026.08',desc:'Developed algorithms for VLA training, policy post-training, and unified modeling of heterogeneous embodied data. Built data cleaning, bounding-box annotation, instruction augmentation, training, and generalization evaluation pipelines for language-conditioned multi-object grasping. Collected real-robot rollout and intervention data for a dressing task and applied value-guided offline RL post-training. Contributed to UCAG-P by aligning robot and human demonstrations in a shared visual-geometric action space.'}],outputs:[{title:'Value-Guided Offline RL Post-Training for Dressing Tasks',line:'First author · In progress',status:'IN PROGRESS'},{title:'UCAG-P: Unified Camera-Centric Action Geometry for Heterogeneous Embodied Manipulation',line:'First author · AAAI under review',status:'UNDER REVIEW'}],foot:'© 2026 Jiaqi Zhou · Embodied AI'};
let lang='zh';
function mediaMarkup(p,d){const m=p.media;if(!m)return`<div class="media-state"><div class="media-state-inner"><div class="play">▶</div>${d.videoNote}</div></div>`;if(m.type==='video')return`<video class="project-media video" controls preload="metadata" playsinline><source src="${m.src}" type="video/mp4"></video>`;return`<img class="project-media image" src="${m.src}" alt="${m.title}" loading="lazy">`}
function render(){const d=lang==='zh'?zh:en;document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=d.name+' · Embodied AI';[['name',d.name],['en-name',d.enName],['lead',d.lead],['focus-label',d.focus],['about-title',d.aboutTitle],['research-title',d.researchTitle],['experience-title',d.experienceTitle],['outputs-title',d.outputsTitle],['foot',d.foot]].forEach(([id,v])=>document.getElementById(id).textContent=v);['nav-about','nav-research','nav-experience','nav-outputs'].forEach((id,i)=>document.getElementById(id).textContent=d.nav[i]);d.about.forEach((v,i)=>document.getElementById('about-'+(i+1)).textContent=v);document.getElementById('stats').innerHTML=d.stats.map(x=>`<div class="stat"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('');document.getElementById('research-list').innerHTML=d.projects.map((p,i)=>`<article class="project"><div class="project-index">0${i+1}<span>SELECTED WORK</span></div><div class="project-main"><div class="head"><div><h3 class="title">${p.title}</h3><div class="subtitle">${p.sub}</div></div><div class="time">${p.time}</div></div><div class="badges"><span class="badge">${p.kind}</span>${p.out?`<span class="badge">${d.output}: ${p.out}</span>`:''}</div><p class="desc">${p.desc}</p><div class="visual"><div class="pipeline">${p.pipeline.map(x=>`<div class="pipe-step"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></div><div class="visual"><div class="media-head"><span>${p.media?.title||d.video}</span><span>${p.media?.type==='image'?'FIGURE':d.video}</span></div>${mediaMarkup(p,d)}</div></div></article>`).join('');document.getElementById('experience-list').innerHTML=d.experience.map(x=>`<article class="experience"><div class="company-mark">MI</div><div><div class="head"><div><h3 class="title">${x.company}</h3><div class="subtitle">${x.role}</div></div><div class="time">${x.time}</div></div><p class="desc">${x.desc}</p></div></article>`).join('');document.getElementById('outputs-list').innerHTML=d.outputs.map((x,i)=>`<article class="output"><span class="output-num">0${i+1}</span><div><h3 class="title">${x.title}</h3><p class="publine">${x.line}</p></div><span class="status">${x.status}</span></article>`).join('');document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang))}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;render()}));render();
</script>
