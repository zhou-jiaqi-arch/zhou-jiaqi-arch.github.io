zh.projects.splice(2,0,{title:'VINE-Guided Human-in-the-Loop Online RL for Plug Insertion',sub:'基于 VINE / HIL-SERL 的插座真机在线强化学习',kind:'项目',time:'2026.07 - 2026.08',out:'',desc:'针对插座插接中接触敏感、离线数据难以覆盖执行偏差的问题，基于 VINE flow-policy actor-critic 与 HIL-SERL 人工接管机制，搭建真机 Rollout、人工 Recovery、数据上传与 QC、增量 Replay、双卡在线更新、策略安全发布与 RTC 推理闭环。仅用 7 条 Recovery 轨迹冷启动，约 20 分钟真机 Online RL 训练中，纯策略 Rollout 成功率达到 <strong>93.0%（40/43）</strong>，末段连续 <strong>19 次</strong>无人接管自主插接成功。',pipeline:[['INTERACTION','真机 Rollout 与人工接管'],['DATA','自动 QC 与增量 Replay'],['LEARNING','Critic 评估与 Q 引导 Actor 更新'],['DEPLOY','Candidate 安全发布与 RTC 推理']],media:{type:'video',src:'online_rl_19_consecutive_policy_successes.mp4',poster:'online_rl_19_consecutive_policy_successes.jpg',title:'连续 19 次无人接管自主插接成功',label:'Policy-only · No recovery · 2× replay'}});
en.projects.splice(2,0,{title:'VINE-Guided Human-in-the-Loop Online RL for Plug Insertion',sub:'Real-robot online reinforcement learning with VINE / HIL-SERL',kind:'Project',time:'2026.07 - 2026.08',out:'',desc:'Built a real-robot online RL loop for contact-sensitive plug insertion using a VINE flow-policy actor-critic and HIL-SERL human intervention. The system integrates rollouts, human recovery, upload and QC, incremental replay, dual-GPU online updates, safe candidate release, and RTC inference. Starting from only seven recovery trajectories, policy-only rollouts reached <strong>93.0% (40/43)</strong> during approximately 20 minutes of online data collection and training, ending with <strong>19 consecutive</strong> autonomous successes without intervention.',pipeline:[['INTERACTION','Robot rollouts & human takeover'],['DATA','Automatic QC & incremental replay'],['LEARNING','Critic evaluation & Q-guided actor'],['DEPLOY','Safe candidate release & RTC']],media:{type:'video',src:'online_rl_19_consecutive_policy_successes.mp4',poster:'online_rl_19_consecutive_policy_successes.jpg',title:'19 consecutive autonomous plug-in successes',label:'Policy-only · No recovery · 2× replay'}});
zh.featuredOutput=zh.projects.splice(zh.projects.findIndex(p=>p.title==='UCAG-P'),1)[0];
en.featuredOutput=en.projects.splice(en.projects.findIndex(p=>p.title==='UCAG-P'),1)[0];
zh.outputs=zh.outputs.filter(x=>!x.title.startsWith('UCAG-P'));
en.outputs=en.outputs.filter(x=>!x.title.startsWith('UCAG-P'));
let lang='zh';
function comparisonMarkup(m){return`<div class="comparison-wrap"><div class="comparison-grid"><div class="comparison-head comparison-corner">MOTION</div>${m.columns.map(x=>`<div class="comparison-head">${x}</div>`).join('')}${m.rows.map(row=>`<div class="comparison-motion">${row.label}</div>${row.sources.map(src=>`<div class="comparison-cell"><video controls preload="metadata" playsinline><source src="${src}" type="video/mp4"></video></div>`).join('')}`).join('')}</div></div>`}
function demoGridMarkup(items,columns,compact){return`<div class="demo-grid${columns===3?' demo-grid-three':columns===4?' demo-grid-four':''}${compact?' demo-grid-compact':''}">${items.map(x=>`<div class="demo-cell"><div class="demo-label">${x.label}</div><video controls preload="metadata" playsinline><source src="${x.src}" type="video/mp4"></video></div>`).join('')}</div>`}
function suiteContentMarkup(s){if(s.type==='comparison')return comparisonMarkup(s);if(s.type==='groups')return s.groups.map(g=>`<div class="demo-group"><div class="demo-group-title">${g.title}</div>${demoGridMarkup(g.items,3)}</div>`).join('');return demoGridMarkup(s.items,s.gridColumns,s.compact)}
function suiteSectionMarkup(s){return`<section class="suite-section"><div class="suite-head"><strong>${s.name}</strong><span>${s.note}</span></div>${suiteContentMarkup(s)}</section>`}
function mediaMarkup(p,d){const m=p.media;if(!m)return`<div class="media-state"><div class="media-state-inner"><div class="play">▶</div>${d.videoNote}</div></div>`;if(m.type==='video')return`<div class="${m.vertical?'vertical-video':m.portrait?'portrait-video':''}"><video class="project-media video" controls preload="metadata" playsinline${m.poster?` poster="${m.poster}"`:''}><source src="${m.src}" type="video/mp4"></video></div>`;if(m.type==='videoComparison')return comparisonMarkup(m);if(m.type==='humanoidSuite')return`<div class="humanoid-suite">${m.sections.map(s=>s.type==='paired'?`<div class="suite-pair">${s.sections.map(suiteSectionMarkup).join('')}</div>`:suiteSectionMarkup(s)).join('')}</div>`;if(m.type==='results')return`<div class="result-grid">${m.items.map(x=>`<div class="result-item"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div>`;return`<img class="project-media image" src="${m.src}" alt="${m.title}" loading="lazy">`}
function projectMarkup(p,d,i,featured=false){return`<article class="project${featured?' featured-output':''}"><div class="project-index">0${i+1}<span>SELECTED WORK</span></div><div class="project-main"><div class="head"><div><h3 class="title">${p.title}</h3><div class="subtitle">${p.sub}</div></div><div class="time">${p.time}</div></div><div class="badges"><span class="badge">${p.kind}</span>${p.out?`<span class="badge">${d.output}: ${p.out}</span>`:''}</div><p class="desc">${p.desc}</p>${p.pipeline&&p.pipeline.length?`<div class="visual"><div class="pipeline">${p.pipeline.map(x=>`<div class="pipe-step"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></div>`:''}${p.media?`<div class="visual"><div class="media-head"><span>${p.media.title}</span><span>${p.media.type==='image'?'FIGURE':d.video}</span></div>${mediaMarkup(p,d)}</div>`:''}</div></article>`}
function render(){const d=lang==='zh'?zh:en;document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=d.name+' · Embodied AI';[['name',d.name],['en-name',d.enName],['lead',d.lead],['focus-label',d.focus],['about-title',d.aboutTitle],['about-lead',d.aboutLead],['research-title',d.researchTitle],['experience-title',d.experienceTitle],['outputs-title',d.outputsTitle],['foot',d.foot]].forEach(([id,v])=>document.getElementById(id).textContent=v);document.getElementById('focus-list').innerHTML=d.focusItems.map(x=>`<li><span></span>${x}</li>`).join('');['nav-about','nav-experience','nav-research','nav-outputs'].forEach((id,i)=>document.getElementById(id).textContent=d.nav[i]);d.about.forEach((v,i)=>document.getElementById('about-'+(i+1)).textContent=v);document.getElementById('stats').innerHTML=d.stats.map(x=>`<div class="stat"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('');document.getElementById('research-list').innerHTML=d.projects.map((p,i)=>`<article class="project"><div class="project-index">0${i+1}<span>SELECTED WORK</span></div><div class="project-main"><div class="head"><div><h3 class="title">${p.title}</h3><div class="subtitle">${p.sub}</div></div><div class="time">${p.time}</div></div><div class="badges"><span class="badge">${p.kind}</span>${p.out?`<span class="badge">${d.output}: ${p.out}</span>`:''}</div><p class="desc">${p.desc}</p>${p.pipeline&&p.pipeline.length?`<div class="visual"><div class="pipeline">${p.pipeline.map(x=>`<div class="pipe-step"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></div>`:''}${p.media?`<div class="visual"><div class="media-head"><span>${p.media.title}</span><span>${p.media.type==='image'?'FIGURE':d.video}</span></div>${mediaMarkup(p,d)}</div>`:''}</div></article>`).join('');document.getElementById('experience-list').innerHTML=d.experience.map(x=>`<article class="experience"><div class="head"><div><h3 class="title">${x.company}</h3><div class="subtitle">${x.role}</div></div><div class="time">${x.time}</div></div><p class="desc">${x.desc}</p></article>`).join('');document.getElementById('outputs-list').innerHTML=d.outputs.map((x,i)=>`<article class="output"><span class="output-num">0${i+1}</span><div><h3 class="title">${x.title}</h3><p class="publine">${x.line}</p></div><span class="status">${x.status}</span></article>`).join('');document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang))}
const renderPage=render;
render=()=>{renderPage();const d=lang==='zh'?zh:en;document.getElementById('interest-tags').innerHTML=d.interestTags.map(x=>`<span class="interest-tag">${x}</span>`).join('');if(d.featuredOutput){const list=document.getElementById('outputs-list');list.innerHTML=projectMarkup(d.featuredOutput,d,0,true)+list.innerHTML}document.querySelectorAll('#research-list .project').forEach((el,i)=>{const media=d.projects[i].media;if(media&&media.label){const target=el.querySelector('.media-head span:last-child');if(target)target.textContent=media.label}if(media&&media.compact){const visuals=el.querySelectorAll('.project-main>.visual');if(visuals.length)visuals[visuals.length-1].classList.add('compact-media')}})};
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;render()}));render();
const sectionLinks=[...document.querySelectorAll('.sidebar .nav a')];
const sections=sectionLinks.map(link=>document.querySelector(link.getAttribute('href')));
const setActiveSection=()=>{const current=[...sections].reverse().find(section=>section.getBoundingClientRect().top<=innerHeight*.35)||sections[0];sectionLinks.forEach(link=>link.classList.toggle('active',link.getAttribute('href')==='#'+current.id))};
addEventListener('scroll',setActiveSection,{passive:true});setActiveSection();
</script>
</body>
</html>
